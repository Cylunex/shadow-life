<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1725" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Shadow Life</title>
    <style>
      .boot-shell{min-height:100vh;display:grid;place-items:center;padding:2rem;font:16px/1.6 system-ui;color:#2e2a25;background:#f5f1e8}
      @media(prefers-color-scheme:dark){.boot-shell{color:#eaf2fd;background:#0d1725}}
    </style>
  </head>
  <body>
    <div id="root" role="status" aria-live="polite">
      <main class="boot-shell">
        <div><strong>Shadow Life</strong><p>正在加载生活工作台…</p></div>
      </main>
    </div>
    <noscript>Shadow Life 需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
